<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HPC PageRank - Interactive UI</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/vis-network.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/vis-network.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1419;
            --surface: #1a2332;
            --border: #2d3a4d;
            --accent: #3b82f6;
            --accent-dim: #2563eb;
            --success: #22c55e;
            --muted: #64748b;
            --text: #e2e8f0;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Outfit', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem;
        }
        header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }
        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle { color: var(--muted); font-size: 0.9rem; margin-top: 0.25rem; }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
        }
        .card h2 {
            font-size: 1rem;
            font-weight: 600;
            margin: 0 0 1rem 0;
            color: var(--text);
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        select {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
        }
        .btn {
            font-family: inherit;
            font-weight: 600;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-serial { background: #6366f1; color: white; }
        .btn-openmp { background: #0ea5e9; color: white; }
        .btn-mpi { background: #10b981; color: white; }
        .graph-container {
            height: 320px;
            background: var(--bg);
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .output {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
        }
        .output.empty { color: var(--muted); }
        .metrics {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1rem;
        }
        .metric {
            background: var(--bg);
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            font-size: 0.85rem;
        }
        .metric span { color: var(--muted); }
        .metric strong { color: var(--accent); }
        .pagerank-bars {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }
        .pr-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 48px;
        }
        .pr-bar .bar {
            width: 24px;
            min-height: 4px;
            background: linear-gradient(to top, var(--accent), #60a5fa);
            border-radius: 4px 4px 0 0;
            transition: height 0.3s;
        }
        .pr-bar .label { font-size: 0.7rem; color: var(--muted); margin-top: 0.25rem; }
        .error { color: #f87171; }
        .loading { opacity: 0.7; }
        .param-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
        .param-row label { font-size: 0.85rem; min-width: 80px; }
        .param-row input { width: 60px; padding: 0.35rem; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>HPC PageRank</h1>
            <p class="subtitle">Run Serial, OpenMP, and MPI implementations — visualize the graph and results</p>
        </header>

        <div class="grid">
            <div class="card">
                <h2>Graph</h2>
                <div class="controls">
                    <select id="graphSelect"></select>
                    <button class="btn btn-serial" id="btnSerial">Run Serial</button>
                    <button class="btn btn-openmp" id="btnOpenMP">Run OpenMP</button>
                    <button class="btn btn-mpi" id="btnMPI">Run MPI</button>
                </div>
                <div class="param-row">
                    <label>OpenMP threads:</label>
                    <input type="number" id="threads" value="4" min="1" max="64">
                </div>
                <div class="param-row">
                    <label>MPI processes:</label>
                    <input type="number" id="procs" value="2" min="1" max="16">
                </div>
                <div class="graph-container" id="graph"></div>
            </div>

            <div class="card">
                <h2>Output & Metrics</h2>
                <div id="output" class="output empty">Select a graph and run an implementation.</div>
                <div id="metrics" class="metrics" style="display:none;"></div>
                <div id="pagerankBars" class="pagerank-bars" style="display:none;"></div>
            </div>
        </div>
    </div>

    <script>
        const graphSelect = document.getElementById('graphSelect');
        const graphDiv = document.getElementById('graph');
        const outputDiv = document.getElementById('output');
        const metricsDiv = document.getElementById('metrics');
        const prBarsDiv = document.getElementById('pagerankBars');
        const btnSerial = document.getElementById('btnSerial');
        const btnOpenMP = document.getElementById('btnOpenMP');
        const btnMPI = document.getElementById('btnMPI');

        let network = null;
        let pagerankValues = [];

        async function loadGraphs() {
            const r = await fetch('/api/graphs');
            const data = await r.json();
            graphSelect.innerHTML = '';
            data.graphs.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g.path;
                opt.textContent = g.name;
                graphSelect.appendChild(opt);
            });
            if (data.graphs.length) await loadGraphViz(data.graphs[0].path);
        }

        async function loadGraphViz(path) {
            const r = await fetch('/api/graph/' + encodeURIComponent(path));
            const data = await r.json();
            if (data.error) return;

            const nodes = new vis.DataSet(data.nodes.map(n => ({ id: n.id, label: String(n.id) })));
            const edges = new vis.DataSet(data.edges.map(e => ({ from: e.from, to: e.to })));

            const options = {
                nodes: { shape: 'dot', size: 16, font: { size: 12 } },
                edges: { arrows: 'to' },
                physics: { stabilization: { iterations: 100 } }
            };

            if (network) network.destroy();
            network = new vis.Network(graphDiv, { nodes, edges }, options);
        }

        async function run(impl) {
            const graph = graphSelect.value;
            if (!graph) { outputDiv.textContent = 'No graph selected.'; outputDiv.classList.remove('empty'); return; }

            [btnSerial, btnOpenMP, btnMPI].forEach(b => b.disabled = true);
            outputDiv.textContent = 'Running...';
            outputDiv.classList.remove('empty');

            const body = { impl, graph };
            if (impl === 'openmp') body.threads = parseInt(document.getElementById('threads').value) || 4;
            if (impl === 'mpi') body.procs = parseInt(document.getElementById('procs').value) || 2;

            try {
                const r = await fetch('/api/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await r.json();

                if (!r.ok) {
                    outputDiv.textContent = data.error || 'Error';
                    outputDiv.classList.add('error');
                    metricsDiv.style.display = 'none';
                    prBarsDiv.style.display = 'none';
                } else {
                    outputDiv.textContent = data.raw || '';
                    outputDiv.classList.remove('error');

                    if (data.time_ms != null) {
                        metricsDiv.innerHTML = `
                            <div class="metric"><span>Time:</span> <strong>${data.time_ms.toFixed(4)} ms</strong></div>
                            ${data.vertices != null ? `<div class="metric"><span>Vertices:</span> <strong>${data.vertices}</strong></div>` : ''}
                            ${data.edges != null ? `<div class="metric"><span>Edges:</span> <strong>${data.edges}</strong></div>` : ''}
                        `;
                        metricsDiv.style.display = 'flex';
                    } else {
                        metricsDiv.style.display = 'none';
                    }

                    if (data.pagerank && data.pagerank.length) {
                        pagerankValues = data.pagerank;
                        const maxVal = Math.max(...pagerankValues);
                        prBarsDiv.innerHTML = pagerankValues.map((v, i) => `
                            <div class="pr-bar">
                                <div class="bar" style="height: ${maxVal > 0 ? (v / maxVal) * 80 : 0}px"></div>
                                <span class="label">${i}: ${v.toFixed(4)}</span>
                            </div>
                        `).join('');
                        prBarsDiv.style.display = 'flex';

                        if (network && data.pagerank) {
                            const nodes = network.body.data.nodes.get();
                            nodes.forEach(n => {
                                const pr = data.pagerank[n.id];
                                if (pr != null) n.title = `Node ${n.id}: ${pr.toFixed(6)}`;
                            });
                            network.body.data.nodes.update(nodes);
                        }
                    } else {
                        prBarsDiv.style.display = 'none';
                    }
                }
            } catch (e) {
                outputDiv.textContent = 'Request failed: ' + e.message;
                outputDiv.classList.add('error');
            }

            [btnSerial, btnOpenMP, btnMPI].forEach(b => b.disabled = false);
        }

        graphSelect.addEventListener('change', () => loadGraphViz(graphSelect.value));
        btnSerial.addEventListener('click', () => run('serial'));
        btnOpenMP.addEventListener('click', () => run('openmp'));
        btnMPI.addEventListener('click', () => run('mpi'));

        loadGraphs();
    </script>
</body>
</html>
