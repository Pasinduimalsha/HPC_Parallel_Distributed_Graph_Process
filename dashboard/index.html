<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HPC PageRank Performance Suite</title>
    <!-- Premium Typography & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <!-- ChartJS for visual analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b0b0f;
            --card-bg: rgba(20, 20, 31, 0.6);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f4f4f6;
            --text-muted: #a1a1aa;
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.15);
            --accent-blue: #3b82f6;
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-display: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: var(--font-main);
            line-height: 1.5;
            padding: 0;
            min-height: 100vh;
        }

        /* Navigation Bar */
        nav {
            background: rgba(15, 15, 25, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0.8rem 2rem;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary), var(--accent-blue));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-family: var(--font-display);
            color: white;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
        }

        .brand-text h1 {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.3rem;
            background: linear-gradient(135deg, #ffffff 40%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.01em;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-link.active {
            border-bottom: 2px solid var(--primary);
            border-radius: 8px 8px 0 0;
            background: rgba(139, 92, 246, 0.08);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .selector-box {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            padding: 0.4rem 0.8rem;
            border-radius: 10px;
        }

        .selector-box label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .selector-box select {
            background: #0b0b12;
            border: none;
            color: var(--text-main);
            font-family: var(--font-main);
            font-weight: 500;
            outline: none;
            cursor: pointer;
            padding-right: 1rem;
        }

        .selector-box select option,
        .control-group select option {
            background: #0b0b12;
            color: #f4f4f5;
        }

        /* Container & Tabs */
        .app-container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Grid layouts */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            border-color: rgba(139, 92, 246, 0.3);
            box-shadow: 0 8px 32px 0 rgba(139, 92, 246, 0.05);
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title span {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
        }

        /* Controls Box & Benchmarks */
        .controls-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .control-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .control-group select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.6rem;
            border-radius: 8px;
            font-family: var(--font-main);
            outline: none;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 0.5rem;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.75rem 0.25rem;
            border-radius: 10px;
            font-family: var(--font-main);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-serial:hover {
            background-color: var(--text-muted);
            border-color: var(--text-muted);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        .btn-openmp:hover {
            background-color: var(--accent-blue);
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        .btn-mpi:hover {
            background-color: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
        }

        .btn-hybrid:hover {
            background-color: #f59e0b;
            border-color: #f59e0b;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        /* Stats summary table */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0.5rem;
        }

        th,
        td {
            text-align: left;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--card-border);
        }

        th {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            font-size: 0.9rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .highlight-emerald {
            color: var(--accent-emerald);
            font-weight: 600;
        }

        .highlight-blue {
            color: var(--accent-blue);
            font-weight: 600;
        }

        .highlight-purple {
            color: var(--primary);
            font-weight: 600;
        }

        .highlight-rose {
            color: var(--accent-rose);
            font-weight: 600;
        }
        /* Terminal Console */
        .terminal {
            background: #040406;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1rem;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: #38bdf8;
            max-height: 250px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-top: 1rem;
            border-left: 3px solid var(--primary);
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-family: var(--font-main);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        /* Chart container */
        .chart-container {
            position: relative;
            height: 250px;
            width: 100%;
            margin-top: 1rem;
        }

        /* Graph Info Badge */
        .info-row {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            background: rgba(255, 255, 255, 0.02);
            padding: 0.75rem 1rem;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            font-size: 0.85rem;
        }

        .info-item span {
            color: var(--text-muted);
            font-weight: 500;
        }

        .info-item strong {
            color: var(--text-main);
            margin-left: 0.25rem;
        }

        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.1);
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border-left-color: var(--text-main);
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <!-- Sticky Navigation Header -->
    <nav>
        <div class="nav-container">
            <a href="#" class="brand">
                <div class="brand-logo">H</div>
                <div class="brand-text">
                    <h1>HPC PageRank Analytics</h1>
                </div>
            </a>

            <div class="header-controls">
                <div class="selector-box">
                    <label for="graph-select">Graph Dataset</label>
                    <select id="graph-select">
                        <!-- Loaded dynamically -->
                    </select>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="app-container">

        <!-- Tab 1: Performance Analytics (Standard view rearranged beautifully) -->
        <div id="analytics-tab" class="tab-content active">
            <div class="dashboard-grid">

                <!-- Left panel: execution dashboard controls and summary stats -->
                <div style="display: flex; flex-direction: column; gap: 2rem;">

                    <div class="card">
                        <div class="card-title">
                            Benchmark Execution Control
                        </div>

                        <div class="info-row">
                            <div class="info-item"><span>Vertices:</span><strong id="info-vertices">0</strong></div>
                            <div class="info-item"><span>Edges:</span><strong id="info-edges">0</strong></div>
                        </div>

                        <div class="controls-row">
                            <div class="control-group">
                                <label for="threads-select">OpenMP Threads</label>
                                <select id="threads-select" onchange="updateParameters()">
                                    <option value="1">1 Thread</option>
                                    <option value="2">2 Threads</option>
                                    <option value="4" selected>4 Threads</option>
                                    <option value="8">8 Threads</option>
                                    <option value="12">12 Threads</option>
                                </select>
                            </div>
                            <div class="control-group">
                                <label for="procs-select">MPI Processes</label>
                                <select id="procs-select" onchange="updateParameters()">
                                    <option value="1">1 Process</option>
                                    <option value="2" selected>2 Processes</option>
                                    <option value="4">4 Processes</option>
                                    <option value="8">8 Processes</option>
                                </select>
                            </div>
                        </div>

                        <div class="btn-grid">
                            <button class="btn btn-serial" onclick="runBenchmark('serial')">
                                <span id="serial-label">Run Serial</span>
                            </button>
                            <button class="btn btn-openmp" onclick="runBenchmark('openmp')">
                                <span id="openmp-label">Run OpenMP</span>
                            </button>
                            <button class="btn btn-mpi" onclick="runBenchmark('mpi')">
                                <span id="mpi-label">Run MPI</span>
                            </button>
                            <button class="btn btn-hybrid" onclick="runBenchmark('hybrid')">
                                <span id="hybrid-label">Run Hybrid</span>
                            </button>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-title">Performance Summary Table</div>
                        <table>
                            <thead>
                                <tr>
                                    <th>Model</th>
                                    <th>Time</th>
                                    <th>Speedup</th>
                                    <th>Efficiency</th>
                                    <th>Resource Count</th>
                                    <th>RMSE</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Serial Baseline</td>
                                    <td id="tbl-serial-time">-</td>
                                    <td>1.00x</td>
                                    <td>1.00</td>
                                    <td>1 CPU core</td>
                                    <td>Baseline</td>
                                </tr>
                                <tr>
                                    <td class="highlight-blue">OpenMP</td>
                                    <td id="tbl-openmp-time">-</td>
                                    <td id="tbl-openmp-speedup">-</td>
                                    <td id="tbl-openmp-efficiency">-</td>
                                    <td id="tbl-openmp-resource">-</td>
                                    <td id="tbl-openmp-rmse">-</td>
                                </tr>
                                <tr>
                                    <td class="highlight-purple">MPI</td>
                                    <td id="tbl-mpi-time">-</td>
                                    <td id="tbl-mpi-speedup">-</td>
                                    <td id="tbl-mpi-efficiency">-</td>
                                    <td id="tbl-mpi-resource">-</td>
                                    <td id="tbl-mpi-rmse">-</td>
                                </tr>
                                <tr>
                                    <td style="color:#f59e0b; font-weight:700;">Hybrid</td>
                                    <td id="tbl-hybrid-time">-</td>
                                    <td id="tbl-hybrid-speedup">-</td>
                                    <td id="tbl-hybrid-efficiency">-</td>
                                    <td id="tbl-hybrid-resource">-</td>
                                    <td id="tbl-hybrid-rmse">-</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </div>

                <!-- Right panel: live charts & output -->
                <div style="display: flex; flex-direction: column; gap: 2rem;">

                    <div class="card">
                        <div class="card-title">Execution Time Comparison</div>
                        <div class="chart-container">
                            <canvas id="timeChart"></canvas>
                        </div>
                    </div>

                    <div class="card">
                        <div class="terminal-header">
                            <span>CMD Terminal Output</span>
                        </div>
                        <div class="terminal" id="console" style="max-height: 260px;"></div>
                    </div>

                </div>

            </div>
        </div>

    </div>

    <!-- Script integrations -->
    <script>
        let timeChart = null;
        let graphs = [];
        let currentGraph = "";
        // Navigation controls
        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active');
            });
            document.getElementById(tabId).classList.add('active');
            el.classList.add('active');

            if (tabId === 'analytics-tab') {
                if (timeChart) timeChart.resize();
            }
        }
        function updateParameters() {}

        // Initialize Charts
        function initCharts() {
            const timeCtx = document.getElementById('timeChart').getContext('2d');
            timeChart = new Chart(timeCtx, {
                type: 'bar',
                data: {
                    labels: ['Serial', 'OpenMP', 'MPI', 'Hybrid'],
                    datasets: [{
                        label: 'Execution Time (ms)',
                        data: [0, 0, 0, 0],
                        backgroundColor: [
                            'rgba(161, 161, 170, 0.6)',
                            'rgba(59, 130, 246, 0.6)',
                            'rgba(139, 92, 246, 0.6)',
                            'rgba(245, 158, 11, 0.6)'
                        ],
                        borderColor: [
                            '#a1a1aa',
                            '#3b82f6',
                            '#8b5cf6',
                            '#f59e0b'
                        ],
                        borderWidth: 1.5,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#a1a1aa' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#a1a1aa' }
                        }
                    }
                }
            });

        }

        // Fetch available graphs
        async function fetchGraphs() {
            try {
                const response = await fetch('/api/graphs');
                graphs = await response.json();
                const select = document.getElementById('graph-select');
                select.innerHTML = '';
                graphs.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g.path;
                    opt.textContent = g.name;
                    select.appendChild(opt);
                });

                if (graphs.length > 0) {
                    currentGraph = graphs[0].path;
                    fetchResults(currentGraph);
                }
            } catch (err) {
                console.error("Error loading graphs:", err);
            }
        }

        // Fetch statistics for specific graph
        async function fetchResults(graphPath) {
            try {
                const response = await fetch(`/api/results?graph=${encodeURIComponent(graphPath)}`);
                const data = await response.json();
                updateUI(data);
            } catch (err) {
                console.error("Error loading results:", err);
            }
        }

        // Update Dashboard GUI based on loaded JSON stats
        function updateUI(data) {
            document.getElementById('info-vertices').textContent = data.vertices || 0;
            document.getElementById('info-edges').textContent = data.edges || 0;

            const times = [0, 0, 0, 0];
            const formatRmse = (value) => {
                return Number.isFinite(value) ? value.toExponential(3) : "-";
            };

            if (data.serial) {
                document.getElementById('tbl-serial-time').textContent = data.serial.time_ms.toFixed(4) + " ms";
                times[0] = data.serial.time_ms;
            } else {
                document.getElementById('tbl-serial-time').textContent = "-";
            }

            if (data.openmp) {
                document.getElementById('tbl-openmp-time').textContent = data.openmp.time_ms.toFixed(4) + " ms";
                document.getElementById('tbl-openmp-speedup').textContent = data.openmp.speedup ? data.openmp.speedup.toFixed(2) + "x" : "-";
                document.getElementById('tbl-openmp-efficiency').textContent = data.openmp.efficiency ? data.openmp.efficiency.toFixed(2) : "-";
                document.getElementById('tbl-openmp-resource').textContent = `${data.openmp.threads} CPU threads`;
                document.getElementById('tbl-openmp-rmse').textContent = formatRmse(data.openmp.rmse_vs_serial);
                times[1] = data.openmp.time_ms;
            } else {
                document.getElementById('tbl-openmp-time').textContent = "-";
                document.getElementById('tbl-openmp-speedup').textContent = "-";
                document.getElementById('tbl-openmp-efficiency').textContent = "-";
                document.getElementById('tbl-openmp-resource').textContent = "-";
                document.getElementById('tbl-openmp-rmse').textContent = "-";
            }

            if (data.mpi) {
                document.getElementById('tbl-mpi-time').textContent = data.mpi.time_ms.toFixed(4) + " ms";
                document.getElementById('tbl-mpi-speedup').textContent = data.mpi.speedup ? data.mpi.speedup.toFixed(2) + "x" : "-";
                document.getElementById('tbl-mpi-efficiency').textContent = data.mpi.efficiency ? data.mpi.efficiency.toFixed(2) : "-";
                document.getElementById('tbl-mpi-resource').textContent = `${data.mpi.processes} MPI processes`;
                document.getElementById('tbl-mpi-rmse').textContent = formatRmse(data.mpi.rmse_vs_serial);
                times[2] = data.mpi.time_ms;
            } else {
                document.getElementById('tbl-mpi-time').textContent = "-";
                document.getElementById('tbl-mpi-speedup').textContent = "-";
                document.getElementById('tbl-mpi-efficiency').textContent = "-";
                document.getElementById('tbl-mpi-resource').textContent = "-";
                document.getElementById('tbl-mpi-rmse').textContent = "-";
            }

            if (data.hybrid) {
                document.getElementById('tbl-hybrid-time').textContent = data.hybrid.time_ms.toFixed(4) + " ms";
                document.getElementById('tbl-hybrid-speedup').textContent = data.hybrid.speedup ? data.hybrid.speedup.toFixed(2) + "x" : "-";
                document.getElementById('tbl-hybrid-efficiency').textContent = data.hybrid.efficiency ? data.hybrid.efficiency.toFixed(2) : "-";
                const hybridUnits = data.hybrid.resource_units ? ` (${data.hybrid.resource_units.toFixed(1)} units)` : "";
                document.getElementById('tbl-hybrid-resource').textContent = `${data.hybrid.threads} CPU threads + ${(data.hybrid.gpu_fraction * 100).toFixed(0)}% GPU${hybridUnits}`;
                document.getElementById('tbl-hybrid-rmse').textContent = formatRmse(data.hybrid.rmse_vs_serial);
                times[3] = data.hybrid.time_ms;
            } else {
                document.getElementById('tbl-hybrid-time').textContent = "-";
                document.getElementById('tbl-hybrid-speedup').textContent = "-";
                document.getElementById('tbl-hybrid-efficiency').textContent = "-";
                document.getElementById('tbl-hybrid-resource').textContent = "-";
                document.getElementById('tbl-hybrid-rmse').textContent = "-";
            }

            timeChart.data.datasets[0].data = times;
            timeChart.update();
        }

        // Run PageRank on C binary via backend API
        async function runBenchmark(impl) {
            const terminal = document.getElementById('console');
            const statusBadge = document.getElementById('log-status');
            const threads = document.getElementById('threads-select').value;
            const procs = document.getElementById('procs-select').value;
            const gpuFraction = 1.0;
            const btn = document.querySelector(`.btn-${impl}`);
            const originalLabel = document.getElementById(`${impl}-label`).innerHTML;

            if (statusBadge) {
                statusBadge.textContent = "RUNNING";
                statusBadge.style.color = "var(--accent-rose)";
            }
            document.getElementById(`${impl}-label`).innerHTML = `<div class="spinner"></div>`;
            document.querySelectorAll('.btn').forEach(b => b.disabled = true);
            terminal.textContent = "";

            try {
                const response = await fetch('/api/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ impl, graph: currentGraph, threads, procs, gpu_fraction: gpuFraction })
                });

                let data;
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.includes("application/json")) {
                    data = await response.json();
                } else {
                    const text = await response.text();
                    data = { error: `Server returned non-JSON response (Status ${response.status})`, raw: text };
                }

                if (response.ok) {
                    terminal.textContent = data.raw;
                    terminal.scrollTop = terminal.scrollHeight;
                    await fetchResults(currentGraph);
                    if (statusBadge) {
                        statusBadge.textContent = "SUCCESS";
                        statusBadge.style.color = "var(--accent-emerald)";
                    }
                } else {
                    terminal.textContent = data.raw || data.error || 'Server error';
                    if (statusBadge) {
                        statusBadge.textContent = "FAILED";
                        statusBadge.style.color = "var(--accent-rose)";
                    }
                }
            } catch (err) {
                terminal.textContent = "";
                if (statusBadge) {
                    statusBadge.textContent = "FAILED";
                    statusBadge.style.color = "var(--accent-rose)";
                }
            } finally {
                document.getElementById(`${impl}-label`).innerHTML = originalLabel;
                document.querySelectorAll('.btn').forEach(b => b.disabled = false);
            }
        }

        // Event listener for dropdown selection
        document.getElementById('graph-select').addEventListener('change', function (e) {
            currentGraph = e.target.value;
            fetchResults(currentGraph);
        });

        // Initialize Page layouts
        window.addEventListener('DOMContentLoaded', () => {
            initCharts();
            fetchGraphs();
        });
    </script>
</body>

</html>
