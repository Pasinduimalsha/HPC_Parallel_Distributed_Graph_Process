# HPC PageRank - Conda environment
# Install: conda env create -f environment.yml
# Activate: conda activate hpc-env

name: hpc-env
channels:
  - conda-forge
  - defaults
dependencies:
  - c-compiler
  - cxx-compiler
  - cmake
  - make
  - llvm-openmp    # OpenMP runtime (libomp)
  - openmpi        # MPI (mpicc, mpirun)
  - flask
